# The LOC2HOT storage daemon inside the e2e container. Paths are relative to this file.
self:
  daemon_id: loc2hot
  role: storage
  storages: [LOC2HOT]
controller: { url: "http://127.0.0.1:8000", token_file: peer-token }
server: { host: 127.0.0.1, port: 8002 }
broker: { url: "redis://redis:6379/0" }
logging: { level: INFO, format: json }
cache_dir: var/loc2hot
cluster_config: cluster-e2e.yaml
peer_token_file: peer-token
# Become the user with sudo -n -u.
identity: sudo
