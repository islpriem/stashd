# Storage daemon for HOT1: uv run stashd --config dev/daemon-hot1.yaml
# Paths are relative to this file.
self:
  daemon_id: hot1
  role: storage
  storages: [HOT1]
controller: { url: "http://127.0.0.1:8000", token_file: peer-token }
server: { host: 127.0.0.1, port: 8001 }
logging: { level: DEBUG, format: console }
cache_dir: var/hot1
peer_token_file: peer-token
# Development runs as its own user; production uses sudo.
identity: current
worker_pool_size: 4
