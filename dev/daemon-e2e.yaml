# The storage daemon inside the e2e container: it serves both development storages. Paths are relative to this file.
self:
  daemon_id: hot1
  role: storage
  storages: [HOT1, LOC2HOT]
controller: { url: "http://127.0.0.1:8000", token_file: peer-token }
server: { host: 127.0.0.1, port: 8001 }
broker: { url: "redis://redis:6379/0" }
logging: { level: INFO, format: json }
cache_dir: var/daemon
peer_token_file: peer-token
# Become the user with sudo -n -u.
identity: sudo
worker_pool_size: 4
