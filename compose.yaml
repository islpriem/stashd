services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stash
      POSTGRES_PASSWORD: stash
      POSTGRES_DB: stash
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stash"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Only for the checks that need real MUNGE credentials: docker compose --profile e2e
  e2e:
    build: dev/e2e
    profiles: ["e2e"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ..:/workspace
      - e2e-venvs:/opt/venvs
      - e2e-uv-cache:/opt/uv-cache
    working_dir: /workspace
    command: ["sleep", "infinity"]

volumes:
  e2e-venvs:
  e2e-uv-cache:
