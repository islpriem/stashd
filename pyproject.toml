[project]
name = "stashd"
version = "0.1.0"
description = "STASH daemon: controller and storage daemon for HPC data staging"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pymunge>=0.1.3",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.4",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.scripts]
stashd = "stashd.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stashd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["integration: needs the PostgreSQL from compose.yaml"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/stashd"]
branch = true
# SQLAlchemy's async layer runs on greenlets; without this, lines inside a coroutine
# that awaits the database are reported as unexecuted.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RUF", "SIM", "PTH", "ARG", "TID"]
# Domain exceptions are named after the rule they enforce (AllocationLimitExceeded).
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Tests take fixtures they do not use, and their names read as sentences.
"tests/*" = ["ARG", "N802"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# pymunge is a ctypes wrapper around libmunge and ships no type information.
module = ["pymunge.*"]
ignore_missing_imports = true
